name: Release

on:
  push:
    branches: [main]
    # Solo releases cuando cambia código que afecta al APK.
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CODEOWNERS governance
        run: |
          FILE=.github/CODEOWNERS
          if [ ! -f "$FILE" ]; then
            echo "::error::Falta $FILE: no se publica una release sin la protección de CODEOWNERS."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*\*[[:space:]]+@Danybs([[:space:]]|$)' "$FILE"; then
            echo "::error::El patrón '*' de $FILE debe pertenecer a @Danybs."
            exit 1
          fi
          for entry in '/.github/ @Danybs' '/.github/CODEOWNERS @Danybs' '/CODEOWNERS @Danybs' '/docs/CODEOWNERS @Danybs'; do
            if ! grep -Fq "$entry" "$FILE"; then
              echo "::error::Falta la entrada obligatoria '$entry' en $FILE."
              exit 1
            fi
          done
          echo "CODEOWNERS correcto: el owner es @Danybs."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(command -v sdkmanager)
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en $ANDROID_HOME"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          BASE_VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::No se pudo leer versionName de app/build.gradle.kts"
            exit 1
          fi

          git fetch --tags --force --quiet
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            VERSION_NAME="$BASE_VERSION"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "::error::El tag '$LATEST_TAG' no sigue el formato vX.Y.Z"
              exit 1
            fi
            VERSION_NAME="$MAJOR.$MINOR.$((10#$PATCH + 1))"
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::error::El tag v$VERSION_NAME ya existe"
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Prepare optional private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/powerclimb-release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/powerclimb-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew test assembleRelease \
            -Ppowerclimb.versionName="${{ steps.version.outputs.name }}" \
            -Ppowerclimb.versionCode="${{ steps.version.outputs.code }}"

      - name: Rename and verify APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk powerclimb.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose powerclimb.apk
          sha256sum powerclimb.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerclimb-apk
          path: powerclimb.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PowerClimb v${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: powerclimb.apk
          body: |
            ## Install

            1. Download `powerclimb.apk` below.
            2. Sideload to Karoo via USB/ADB:

            ```bash
            adb install powerclimb.apk
            ```

            Direct download:
            https://github.com/${{ github.repository }}/releases/latest/download/powerclimb.apk
